<svg xmlns="http://www.w3.org/2000/svg" viewBox="5.50 6.20 28.60 28.60" role="img" aria-label="GreDami">
  <style>
    @media (prefers-color-scheme: dark) {
      .s0 { stop-color: #7DA0FF; }
      .s1 { stop-color: #8C86F2; }
      .s2 { stop-color: #A98BFA; }
      .s3 { fill: #A78BFA; stroke: #A78BFA; }
    }
  </style>
  <defs>
    <linearGradient id="hb" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop class="s0" offset="0" stop-color="#2657D8"/>
      <stop class="s1" offset="0.55" stop-color="#3436C4"/>
      <stop class="s2" offset="1" stop-color="#5B21B6"/>
    </linearGradient>
    <!-- glass: sky caught in the top of the lens, near-black at the bottom -->
    <linearGradient id="gl" x1="0.15" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#33456F"/>
      <stop offset="0.45" stop-color="#111A3C"/>
      <stop offset="1" stop-color="#05091C"/>
    </linearGradient>
    <clipPath id="lensA"><rect x="8.95" y="11.35" width="4.5" height="3.35" rx="1.45"/></clipPath>
    <clipPath id="lensB"><rect x="14.15" y="11.35" width="3.75" height="3.05" rx="1.35"/></clipPath>
  </defs>
  <g transform="translate(39.60 0) scale(-1 1)">

  <!-- the ridge cap it is perched on, drawn behind the bird so the tail
       hangs over the far slope the way it does in the photograph -->
  <path class="s3"
        d="M12.2 31.7 L17.6 30.35 L26.2 32.1 L26.0 33.4 L17.6 31.95 L12.1 33.2 Z"
        fill="#4A2BC2" stroke="#4A2BC2" stroke-width="0.45"
        stroke-linejoin="round" opacity="0.55"/>

  <!-- body: round breast, rump, tail sweeping down to the right -->
  <path d="M15.0 7.9
           C17.2 7.9 19.0 9.6 19.0 11.8
           C19.0 13.4 18.8 14.6 19.8 15.9
           C21.4 18.0 22.6 20.6 22.9 23.6
           C25.0 25.7 27.8 28.0 30.3 30.2
           C31.0 30.8 30.7 31.8 29.8 31.8
           C28.0 31.2 24.6 29.6 21.6 28.6
           C20.4 30.0 19.0 30.4 17.5 30.1
           C13.5 29.1 11.0 26.3 11.0 22.2
           C11.0 19.0 11.2 16.0 11.6 13.6
           C11.9 11.7 12.0 9.7 12.9 8.7
           C13.4 8.1 14.2 7.9 15.0 7.9 Z"
        fill="url(#hb)"/>

  <!-- folded wing, laid along the back -->
  <path d="M18.8 16.4
           C21.0 18.6 22.4 21.4 23.0 24.6
           C23.4 26.2 23.2 27.6 22.4 28.4
           C20.6 26.8 19.0 24.4 18.5 21.6
           C18.2 19.6 18.3 17.6 18.8 16.4 Z"
        fill="#FFFFFF" fill-opacity="0.17"/>

  <!-- sunglasses: pale frame, two lenses, the far one foreshortened -->
  <g transform="rotate(-9 14.5 13)">
    <!-- temple arm running back over the cheek -->
    <path d="M17.3 12.3 L18.85 12.85" stroke="#C6DBD0" stroke-width="0.58"
          stroke-linecap="round" fill="none"/>

    <rect x="8.95" y="11.35" width="4.5" height="3.35" rx="1.45"
          fill="url(#gl)" stroke="#DCEDE3" stroke-width="0.42"/>
    <rect x="14.15" y="11.35" width="3.75" height="3.05" rx="1.35"
          fill="url(#gl)" stroke="#DCEDE3" stroke-width="0.42"/>

    <!-- glass highlights, clipped to each lens -->
    <g clip-path="url(#lensA)">
      <rect x="9.9" y="10.6" width="0.78" height="4.6" rx="0.39"
            fill="#FFFFFF" fill-opacity="0.40" transform="rotate(-30 10.3 13)"/>
      <rect x="11.15" y="10.9" width="0.42" height="4.2" rx="0.21"
            fill="#FFFFFF" fill-opacity="0.26" transform="rotate(-30 11.36 13)"/>
    </g>
    <g clip-path="url(#lensB)">
      <rect x="15.15" y="10.7" width="0.55" height="4.3" rx="0.27"
            fill="#FFFFFF" fill-opacity="0.30" transform="rotate(-30 15.4 13)"/>
    </g>

    <!-- bridge, then the brow bar across the top of the frame -->
    <rect x="13.3" y="11.8" width="0.95" height="0.6" rx="0.3" fill="#DCEDE3"/>
    <rect x="8.95" y="11.02" width="8.7" height="0.64" rx="0.32" fill="#E0EFE6"/>
  </g>
</g>
</svg>
